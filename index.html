<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Casino Coin Toss</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Georgia', serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body {
            background: #0a0a0a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        
        .game-container {
            width: 1000px;
            max-width: 98%;
            background: #1a1a1a;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            border: 4px solid #333;
        }

        header {
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, #222, #111);
            border-bottom: 3px solid #d4af37;
        }

        .money-display { 
            font-size: 28px; 
            color: #d4af37; 
            font-weight: bold; 
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .table-top {
            position: relative;
            width: 100%;
            height: 520px; 
            background: #076324; 
            background-image: radial-gradient(circle at center, #0a8030 0%, #076324 100%);
            border: 15px solid #3d2b1f; 
            box-shadow: inset 0 0 100px rgba(0,0,0,0.7);
            overflow: hidden;
        }

        .table-top::after {
            content: '';
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 2px solid rgba(212, 175, 55, 0.15);
            border-radius: 120px;
            pointer-events: none;
        }

        .coin {
            position: absolute;
            width: 42px; 
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            transition: left 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), 
                        top 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), 
                        transform 0.5s;
            z-index: 10;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            outline: none; 
        }

        .coin.flipping {
            z-index: 100;
            animation: coin-spin 0.5s linear infinite;
            transform: scale(2.2); 
            pointer-events: none;
        }

        @keyframes coin-spin {
            0% { transform: scale(2.2) rotateX(0deg); }
            100% { transform: scale(2.2) rotateX(360deg); }
        }

        .coin.copper { background: linear-gradient(135deg, #b87333, #8b4513); border: 2px solid #5d2906; color: #fff; }
        .coin.silver { background: linear-gradient(135deg, #c0c0c0, #7a7a7a); border: 2px solid #444; color: #333; }
        .coin.gold { background: linear-gradient(135deg, #ffd700, #b8860b); border: 2px solid #8a6d00; color: #4d3d00; }

        .controls-row {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: #111;
        }

        .upgrade-group {
            flex: 1;
            background: #1a1a1a;
            padding: 8px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid #333;
        }

        .upgrade-group h4 { font-size: 12px; color: #d4af37; text-align: center; letter-spacing: 1px; }

        .btn-pair { display: flex; gap: 6px; }

        button {
            flex: 1;
            padding: 5px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #d4af37;
            border-radius: 4px;
            background: #222;
            color: #d4af37;
            transition: 0.2s;
            outline: none;
        }

        button:hover:not(:disabled) { background: #d4af37; color: #000; }
        button:disabled { border-color: #444; color: #555; cursor: not-allowed; }
        
        .lvl-text { font-size: 11px; color: #888; text-align: center; font-family: sans-serif; }

        .floating-val {
            position: absolute;
            color: #fff;
            font-weight: bold;
            pointer-events: none;
            z-index: 200;
            text-shadow: 0 0 5px rgba(0,0,0,1);
            animation: float-up 0.8s ease-out forwards;
        }

        @keyframes float-up {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-70px); }
        }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <h3>ROYAL CASINO TOSS</h3>
        <div class="money-display">$<span id="money">0</span></div>
    </header>

    <div class="table-top" id="table"></div>

    <div class="controls-row">
        <div class="upgrade-group">
            <h4>COPPER CHIP</h4>
            <div class="btn-pair">
                <button id="buy-copper">BUY ($<span id="cost-c-buy">10</span>)</button>
                <button id="up-copper">LVL+ ($<span id="cost-c-up">20</span>)</button>
            </div>
            <div class="lvl-text">Qty: <span id="cnt-c">1</span> | Payout: $<span id="val-c">1</span></div>
        </div>

        <div class="upgrade-group">
            <h4>SILVER CHIP</h4>
            <div class="btn-pair">
                <button id="buy-silver">BUY ($<span id="cost-s-buy">100</span>)</button>
                <button id="up-silver">LVL+ ($<span id="cost-s-up">150</span>)</button>
            </div>
            <div class="lvl-text">Qty: <span id="cnt-s">0</span> | Payout: $<span id="val-s">5</span></div>
        </div>

        <div class="upgrade-group">
            <h4>GOLD CHIP</h4>
            <div class="btn-pair">
                <button id="buy-gold">BUY ($<span id="cost-g-buy">500</span>)</button>
                <button id="up-gold">LVL+ ($<span id="cost-g-up">600</span>)</button>
            </div>
            <div class="lvl-text">Qty: <span id="cnt-g">0</span> | Payout: $<span id="val-g">20</span></div>
        </div>
    </div>
</div>

<script>
    const state = {
        money: 0,
        copper: { count: 1, val: 1, buyCost: 10, upCost: 20 },
        silver: { count: 0, val: 5, buyCost: 100, upCost: 150 },
        gold: { count: 0, val: 20, buyCost: 500, upCost: 600 }
    };

    const table = document.getElementById('table');
    const COIN_SIZE = 42;
    let audioCtx = null;

    // Synthesized Sound Effect
    function playCoinSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);

        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function updateUI() {
        document.getElementById('money').textContent = Math.floor(state.money).toLocaleString();
        const updateSec = (key, prefix) => {
            document.getElementById(`cnt-${prefix}`).textContent = state[key].count;
            document.getElementById(`val-${prefix}`).textContent = state[key].val;
            document.getElementById(`cost-${prefix}-buy`).textContent = state[key].buyCost;
            document.getElementById(`cost-${prefix}-up`).textContent = state[key].upCost;
            document.getElementById(`buy-${key}`).disabled = state.money < state[key].buyCost;
            document.getElementById(`up-${key}`).disabled = state.money < state[key].upCost;
        };
        updateSec('copper', 'c');
        updateSec('silver', 's');
        updateSec('gold', 'g');
    }

    function createCoin(type) {
        const coin = document.createElement('div');
        coin.className = `coin ${type}`;
        const x = 60 + Math.random() * (table.clientWidth - 120);
        const y = 60 + Math.random() * (table.clientHeight - 120);
        coin.style.left = `${x}px`;
        coin.style.top = `${y}px`;
        coin.textContent = '$';
        coin.onclick = () => flip(coin, type);
        table.appendChild(coin);
    }

    function flip(coin, type) {
        if (coin.classList.contains('flipping')) return;
        
        playCoinSound(); // Trigger sound
        coin.classList.add('flipping');

        const currentX = parseFloat(coin.style.left);
        const currentY = parseFloat(coin.style.top);
        let newX = currentX + (Math.random() - 0.5) * 350;
        let newY = currentY + (Math.random() - 0.5) * 350;

        newX = Math.max(40, Math.min(table.clientWidth - COIN_SIZE - 40, newX));
        newY = Math.max(40, Math.min(table.clientHeight - COIN_SIZE - 40, newY));

        coin.style.left = `${newX}px`;
        coin.style.top = `${newY}px`;

        setTimeout(() => {
            coin.classList.remove('flipping');
            if (Math.random() > 0.45) {
                const win = state[type].val;
                state.money += win;
                coin.textContent = '$';
                showFloat(newX, newY, `+$${win}`);
            } else {
                coin.textContent = '💀';
                setTimeout(() => { coin.textContent = '$'; }, 800);
            }
            updateUI();
        }, 500);
    }

    function showFloat(x, y, text) {
        const float = document.createElement('div');
        float.className = 'floating-val';
        float.textContent = text;
        float.style.left = `${x}px`;
        float.style.top = `${y}px`;
        table.appendChild(float);
        setTimeout(() => float.remove(), 800);
    }

    const setupActions = (type, prefix, valInc, upMult) => {
        document.getElementById(`buy-${type}`).onclick = () => {
            if (state.money >= state[type].buyCost) {
                state.money -= state[type].buyCost;
                state[type].count++;
                state[type].buyCost = Math.floor(state[type].buyCost * 1.5);
                createCoin(type);
                updateUI();
            }
        };
        document.getElementById(`up-${type}`).onclick = () => {
            if (state.money >= state[type].upCost) {
                state.money -= state[type].upCost;
                state[type].val += valInc;
                state[type].upCost = Math.floor(state[type].upCost * upMult);
                updateUI();
            }
        };
    };

    setupActions('copper', 'c', 1, 1.8);
    setupActions('silver', 's', 5, 2.0);
    setupActions('gold', 'g', 20, 2.2);

    for(let i=0; i<state.copper.count; i++) createCoin('copper');
    updateUI();
</script>

</body>
</html>
