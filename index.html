<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Royal Casino - Testnet Mode</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Georgia', serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
       
        body {
            background: #0a0a0a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
       
        .game-container {
            width: 1000px;
            max-width: 98%;
            background: #1a1a1a;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            border: 4px solid #333;
            position: relative;
        }
        header {
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, #222, #111);
            border-bottom: 3px solid #d4af37;
        }
        .money-display { font-size: 24px; color: #d4af37; font-weight: bold; }

        #waiting-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; border-radius: 16px;
        }
        .spinner { 
            width: 50px; height: 50px; 
            border: 5px solid #333; 
            border-top: 5px solid #d4af37; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
            margin-bottom: 15px; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #connect-btn {
            background: #002d72; color: white; border: none; padding: 6px 12px;
            border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold;
        }

        .table-top {
            position: relative;
            width: 100%;
            height: 55vh;
            background: #076324;
            background-image: radial-gradient(circle at center, #0a8030 0%, #076324 100%);
            border: 12px solid #3d2b1f;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.7);
            overflow: hidden;
            touch-action: none;
        }

        .bottlecap {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            transition: left 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        top 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        transform 0.5s, filter 0.2s;
            z-index: 10;
            user-select: none;
            box-shadow: 0 6px 12px rgba(0,0,0,0.7), inset 0 3px 8px rgba(255,255,255,0.4);
            outline: none;
            cursor: pointer;
            image-rendering: crisp-edges;
        }

        .bottlecap::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.15);
            box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .bottlecap::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5) 0%, transparent 60%);
            pointer-events: none;
        }

        .bottlecap.copper {
            background: radial-gradient(circle at 35% 35%, #d2691e, #8b4513 60%, #5c2d0d);
            border: 2px solid #4a2a0a;
            color: #ffe4c4;
            text-shadow: 0 1px 2px #000;
        }

        .bottlecap.silver {
            background: radial-gradient(circle at 35% 35%, #e0e0e0, #a0a0a0 50%, #707070);
            border: 2px solid #505050;
            color: #f0f0f0;
            text-shadow: 0 1px 3px #000;
            box-shadow: 0 6px 14px rgba(0,0,0,0.6), inset 0 4px 10px rgba(255,255,255,0.55);
        }

        .bottlecap.gold {
            background: radial-gradient(circle at 35% 35%, #ffd700, #d4af37 50%, #b8860b);
            border: 2px solid #8a6d00;
            color: #3e2a00;
            text-shadow: 0 1px 2px #000;
            box-shadow: 0 6px 16px rgba(0,0,0,0.5), inset 0 5px 12px rgba(255,255,200,0.7);
        }

        .bottlecap.flipping {
            z-index: 100;
            animation: bottlecap-spin 0.5s linear infinite;
            transform: scale(2.4);
            pointer-events: none;
            filter: brightness(1.4);
        }

        @keyframes bottlecap-spin {
            0%   { transform: scale(2.4) rotateX(0deg) rotateY(0deg); }
            100% { transform: scale(2.4) rotateX(360deg) rotateY(180deg); }
        }

        .bottlecap:hover {
            filter: brightness(1.25);
            transform: scale(1.12);
        }

        .controls-row {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #111;
        }
        .upgrade-group {
            flex: 1;
            background: #1a1a1a;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 1px solid #333;
        }
        .upgrade-group h4 { font-size: 10px; color: #d4af37; text-align: center; }
        button {
            padding: 8px 2px;
            font-size: 10px;
            font-weight: bold;
            border: 1px solid #d4af37;
            border-radius: 4px;
            background: #222;
            color: #d4af37;
            cursor: pointer;
        }
        button:disabled { border-color: #444; color: #555; cursor: not-allowed; }
       
        .lvl-text { font-size: 10px; color: #888; text-align: center; }
        .floating-val {
            position: absolute;
            color: #fff;
            font-weight: bold;
            pointer-events: none;
            z-index: 200;
            text-shadow: 0 0 5px #000;
            animation: float-up 0.8s ease-out forwards;
        }
        @keyframes float-up {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-70px); }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div id="waiting-screen">
        <div class="spinner"></div>
        <h2 style="color: #d4af37;">TESTNET TRANSACTION</h2>
        <p id="wait-msg" style="font-size: 12px; color: #888; margin-top: 10px;">Waiting for 0.1 TCRO...</p>
    </div>
    <header>
        <div>
            <h3 style="font-size: 12px;">ROYAL TOSS</h3>
            <button id="connect-btn">CONNECT WALLET</button>
            <span id="wallet-addr" style="display:none; font-size: 9px; color: #666;"></span>
        </div>
        <div class="money-display">$<span id="money">0</span></div>
    </header>
    <div class="table-top" id="table"></div>
    <div class="controls-row">
        <div class="upgrade-group">
            <h4>COPPER</h4>
            <button id="buy-copper">BUY ($<span id="cost-c-buy">10</span>)</button>
            <button id="up-copper">LVL+ ($<span id="cost-c-up">20</span>)</button>
            <div class="lvl-text">Qty:<span id="cnt-c">1</span> Val:$<span id="val-c">1</span></div>
        </div>
        <div class="upgrade-group">
            <h4>SILVER</h4>
            <button id="buy-silver">BUY ($<span id="cost-s-buy">100</span>)</button>
            <button id="up-silver">LVL+ ($<span id="cost-s-up">150</span>)</button>
            <div class="lvl-text">Qty:<span id="cnt-s">0</span> Val:$<span id="val-s">5</span></div>
        </div>
        <div class="upgrade-group">
            <h4>GOLD</h4>
            <button id="buy-gold">BUY ($<span id="cost-g-buy">500</span>)</button>
            <button id="up-gold">LVL+ ($<span id="cost-g-up">600</span>)</button>
            <div class="lvl-text">Qty:<span id="cnt-g">0</span> Val:$<span id="val-g">20</span></div>
        </div>
        <div class="upgrade-group" style="border-color: #002d72; background: #00122e;">
            <h4 style="color: #4da3ff;">TEST REFILL</h4>
            <button id="crypto-buy" style="background: #002d72; color: white; border: none;">+1,000 (0.1 TCRO)</button>
            <div class="lvl-text" style="color: #4da3ff;">Cronos Testnet</div>
        </div>
    </div>
</div>

<script>
    // --- SETTINGS ---
    const DEVELOPER_WALLET = "0x53140cbcC51E9b113C4a30818fE947a1948eB947";
    const TESTNET_CHAIN_ID = 338n;
    let currentProvider, signer, address, walletConnected = false;
    const state = {
        money: 0,
        copper: { count: 1, val: 1, buyCost: 10, upCost: 20 },
        silver: { count: 0, val: 5, buyCost: 100, upCost: 150 },
        gold: { count: 0, val: 20, buyCost: 500, upCost: 600 }
    };
    const table = document.getElementById('table');
    const CAP_SIZE = 48;
    let audioCtx = null;

    // Wallet connection (previous working version)
    async function connectWallet() {
        if (walletConnected) return;

        if (!window.ethereum) {
            alert("No wallet detected. Install Crypto.com Onchain Extension or use in-app browser.");
            return;
        }

        try {
            currentProvider = new ethers.BrowserProvider(window.ethereum, "any");
            const network = await currentProvider.getNetwork();
            const targetChainId = Number(TESTNET_CHAIN_ID);

            if (Number(network.chainId) !== targetChainId) {
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: `0x${targetChainId.toString(16)}` }],
                    });
                } catch (switchError) {
                    if (switchError.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: `0x${targetChainId.toString(16)}`,
                                chainName: 'Cronos Testnet',
                                nativeCurrency: { name: 'TCRO', symbol: 'TCRO', decimals: 18 },
                                rpcUrls: ['https://evm-t3.cronos.org'],
                                blockExplorerUrls: ['https://testnet.cronosscan.com']
                            }]
                        });
                    } else throw switchError;
                }
            }

            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            address = accounts[0];
            signer = await currentProvider.getSigner();

            walletConnected = true;
            document.getElementById('connect-btn').style.display = 'none';
            document.getElementById('wallet-addr').style.display = 'block';
            document.getElementById('wallet-addr').textContent = address.slice(0,10) + "...";
            updateUI();
        } catch (err) {
            console.error(err);
            alert("Connection failed: " + err.message);
        }
    }

    async function buyWithCrypto() {
        if (!walletConnected || !signer) return alert("Connect wallet first!");

        document.getElementById('waiting-screen').style.display = 'flex';

        try {
            const tx = await signer.sendTransaction({
                to: DEVELOPER_WALLET,
                value: ethers.parseEther("0.1")
            });
            await tx.wait();
            state.money += 1000;
            updateUI();
            alert("Success! +1,000 added (tx: " + tx.hash + ")");
        } catch (err) {
            alert("Transaction failed: " + err.message);
        }

        document.getElementById('waiting-screen').style.display = 'none';
    }

    function playSound(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        const freq = type === 'win' ? 1200 : 800;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq + 400, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    function updateUI() {
        document.getElementById('money').textContent = Math.floor(state.money).toLocaleString();
        ['copper', 'silver', 'gold'].forEach(k => {
            const p = k[0];
            document.getElementById(`cnt-${p}`).textContent = state[k].count;
            document.getElementById(`val-${p}`).textContent = state[k].val;
            document.getElementById(`cost-${p}-buy`).textContent = state[k].buyCost;
            document.getElementById(`cost-${p}-up`).textContent = state[k].upCost;
            document.getElementById(`buy-${k}`).disabled = state.money < state[k].buyCost;
            document.getElementById(`up-${k}`).disabled = state.money < state[k].upCost;
        });
        document.getElementById('crypto-buy').disabled = !walletConnected;
    }

    function createBottlecap(type) {
        const cap = document.createElement('div');
        cap.className = `bottlecap ${type}`;
        cap.dataset.type = type;
        const startX = 50 + Math.random() * (table.clientWidth - 120);
        const startY = 50 + Math.random() * (table.clientHeight - 120);
        cap.style.left = `${startX}px`;
        cap.style.top = `${startY}px`;
        cap.textContent = '★';  // simple emblem - you can change to other symbols
        cap.onpointerdown = (e) => {
            e.stopPropagation();
            const currentX = parseFloat(cap.style.left);
            const currentY = parseFloat(cap.style.top);
            checkGroupFlip(currentX, currentY);
        };
        table.appendChild(cap);
    }

    function checkGroupFlip(targetX, targetY) {
        const caps = document.querySelectorAll('.bottlecap');
        let soundPlayed = false;
        caps.forEach(c => {
            const cx = parseFloat(c.style.left);
            const cy = parseFloat(c.style.top);
            const dist = Math.sqrt(Math.pow(cx - targetX, 2) + Math.pow(cy - targetY, 2));
            if (dist < 60 && !c.classList.contains('flipping')) {
                if (!soundPlayed) { playSound('jump'); soundPlayed = true; }
                flip(c);
            }
        });
    }

    function flip(cap) {
        cap.classList.add('flipping');
        const type = cap.dataset.type;
        let newX = parseFloat(cap.style.left) + (Math.random() - 0.5) * 300;
        let newY = parseFloat(cap.style.top) + (Math.random() - 0.5) * 300;
        newX = Math.max(20, Math.min(table.clientWidth - CAP_SIZE - 20, newX));
        newY = Math.max(20, Math.min(table.clientHeight - CAP_SIZE - 20, newY));
        cap.style.left = `${newX}px`;
        cap.style.top = `${newY}px`;
        setTimeout(() => {
            cap.classList.remove('flipping');
            if (Math.random() > 0.45) {
                const win = state[type].val;
                state.money += win;
                playSound('win');
                showFloat(newX, newY, `+$${win}`);
            } else {
                cap.textContent = '💀';
                setTimeout(() => { cap.textContent = '★'; }, 800);
            }
            updateUI();
        }, 500);
    }

    function showFloat(x, y, text) {
        const f = document.createElement('div');
        f.className = 'floating-val';
        f.textContent = text;
        f.style.left = `${x}px`; f.style.top = `${y}px`;
        table.appendChild(f);
        setTimeout(() => f.remove(), 800);
    }

    function bind(type, p, vInc, uM) {
        document.getElementById(`buy-${type}`).onclick = () => {
            if (state.money >= state[type].buyCost) {
                state.money -= state[type].buyCost;
                state[type].count++;
                state[type].buyCost = Math.floor(state[type].buyCost * 1.5);
                createBottlecap(type);
                updateUI();
            }
        };
        document.getElementById(`up-${type}`).onclick = () => {
            if (state.money >= state[type].upCost) {
                state.money -= state[type].upCost;
                state[type].val += vInc;
                state[type].upCost = Math.floor(state[type].upCost * uM);
                updateUI();
            }
        };
    }

    // --- INIT ---
    document.getElementById('connect-btn').onclick = connectWallet;
    document.getElementById('crypto-buy').onclick = buyWithCrypto;
    bind('copper', 'c', 1, 1.8);
    bind('silver', 's', 5, 2.0);
    bind('gold', 'g', 20, 2.2);

    for(let i = 0; i < state.copper.count; i++) createBottlecap('copper');
    updateUI();

    if (window.ethereum) {
        window.ethereum.on('chainChanged', () => window.location.reload());
    }
</script>
</body>
</html>
